name: zh windows cross build

# Temporary verification workflow for the Chinese-only fork: builds the
# Windows GNU host DLL, the TSF DLL, the Server and the native tests on a
# Linux runner the same way ci-platforms.yml does, without Depot runners.
on:
  workflow_dispatch:
  push:
    branches: [zh-only]

permissions:
  contents: read

jobs:
  cross:
    name: Windows GNU cross build (pinyin edition)
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 360
    steps:
      - name: Install MinGW cross toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64 build-essential cmake ninja-build pkg-config curl ca-certificates git zip unzip tar python3
          # The unsuffixed compiler defaults to the win32 thread model, whose C++ library has no std::thread.
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache vcpkg and cargo
        uses: actions/cache@v4
        with:
          path: |
            target/tooling/vcpkg
            target/windows-native-deps
            ~/.cargo/registry
            ~/.cargo/git
          key: zh-cross-${{ hashFiles('platforms/windows/vcpkg.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            zh-cross-${{ hashFiles('platforms/windows/vcpkg.json') }}-

      - name: Prepare MinGW header aliases
        run: |
          python3 platforms/windows/cross/add-header-aliases.py \
            /usr/share/mingw-w64/include /usr/x86_64-w64-mingw32/include

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup toolchain install
          bash platforms/windows/build-cross.sh x64 pinyin

  settings:
    name: Windows WinUI settings (MSVC)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use a short Cargo cache path
        shell: pwsh
        run: ./platforms/windows/Use-ShortCargoHome.ps1

      - name: Locate vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            if (-not (Test-Path -LiteralPath 'C:\vcpkg\scripts\buildsystems\vcpkg.cmake' -PathType Leaf)) { throw 'vcpkg not found' }
            "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          }

      - name: Build the settings host library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          cargo build --locked -p msime-host-api -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Settings host library build failed' }

      - name: Build the WinUI settings window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe')
          if ($msbuild.Count -lt 1) { throw 'MSBuild not found' }
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          $nativeDeps = Join-Path $env:GITHUB_WORKSPACE 'target/windows-native-deps/settings'
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install 'nlohmann-json:x64-windows-static-md' "--x-install-root=$nativeDeps" --disable-metrics
          if ($LASTEXITCODE -ne 0) { throw 'nlohmann-json install failed' }
          $nativeInclude = Join-Path $nativeDeps 'x64-windows-static-md/include'
          $output = "$env:GITHUB_WORKSPACE/target/windows-pinyin/x64/settings/"
          & $msbuild[0] platforms/windows/settings/MSIME.Settings.vcxproj /restore /t:Build /p:Configuration=RelWithDebInfo /p:Platform=x64 /p:TargetName=msime-client-settings /p:HostApiLibrary="$env:GITHUB_WORKSPACE/target/debug/msime_host_api.dll.lib" /p:NativeDependenciesInclude="$nativeInclude" /p:MsimeEdition=pinyin /p:OutDir="$output" /p:IntDir="$env:GITHUB_WORKSPACE/target/windows-pinyin/x64/settings-obj/" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Settings host build failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $output 'msime-client-settings.exe') -PathType Leaf)) { throw 'msime-client-settings.exe was not produced' }
